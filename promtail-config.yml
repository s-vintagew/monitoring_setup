server:
  http_listen_port: 9080
  grpc_listen_port: 0

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: apache_logs
    static_configs:
      - targets:
          #- localhost
          - host.docker.internal
        labels:
          job: apache_access_logs
          # This is the standard path for Fedora/RHEL Apache logs
          __path__: /var/log/httpd/access_log

  - job_name: system_secure
    static_configs:
    - targets:
        - host.docker.internal
      labels:
        job: varlogs_secure
        __path__: /var/log/secure

  - job_name: system_messages
    static_configs:
    - targets:
        - host.docker.internal
      labels:
        job: varlogs_messages
        __path__: /var/log/messages

  - job_name: system_dnf
    static_configs:
    - targets:
        - host.docker.internal
      labels:
        job: varlogs_dnf
        __path__: /var/log/dnf5.log
