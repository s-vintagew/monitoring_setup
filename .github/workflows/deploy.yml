name: SRE Observability Pipeline

on:
  push:
    branches:
      - main

jobs:
  validate-configs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate configuration files
        uses: docker://prom/prometheus:latest
        with:
          entrypoint: /bin/promtool
          args: check config prometheus.yml

  # ===== CD Phase: Deploy to Fedora Host =====
  deploy:
    runs-on: self-hosted
    needs: validate-configs
    steps:
      - name: Checkout Code
        uses: action/checkout@v4

      - name: Deploy Observability Stack
        run: |
            mkdir -p ~/monitoring_setup_deploy
            # cp docker-compose.yml prometheus.yml promtail-config.yml ~/monitoring_setup_deploy/docker-compose.yml
            cp docker-compose.yml ~/monitoring_setup_deploy/docker-compose.yml
            cp prometheus.yml ~/monitoring_setup_deploy/prometheus.yml
            cp promtail-config.yml ~/monitoring_setup_deploy/promtail-config.yml
            cd ~/monitoring_setup_deploy
            docker compose up -d --remove-orphans

