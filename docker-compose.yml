services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - /var/prometheus/prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - '9090:9090'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - /var/grafana_data:/var/lib/grafana
    ports:
      - '3000:3000'
    restart: unless-stopped

  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    command:
      - '--path.rootfs=/host'
    volumes:
      - '/:/host:ro,rslave'
    ports:
      - '9100:9100'
    restart: unless-stopped

  apache_exporter:
    image: lusotycoon/apache-exporter:latest
    container_name: apache_exporter
    command:
      - '--scrape_uri=http://host.docker.internal/server-status/?auto'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - '9117:9117'
    restart: unless-stopped

  qbittorrent_exporter:
    image: ghcr.io/esanchezm/prometheus-qbittorrent-exporter:latest
    container_name: qbittorrent_exporter
    environment:
      - QBITTORRENT_HOST=host.docker.internal
      - QBITTORRENT_PORT=8080
      # IMPORTANT: If your qBittorrent WebUI requires a password, uncomment and fill these in:
      # - QBITTORRENT_USERNAME=<username>
      # - QBITTORRENT_PASSWORD=<password>
      - EXPORTER_PORT=8081
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - '8081:8081'
    restart: unless-stopped

  blackbox_exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox_exporter
    ports:
      - '9115:9115'
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - /var/loki:/loki
      - ./loki-config.yml:/etc/loki/loki-config.yaml:ro
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    user: root
    volumes:
      - /var/log:/var/log:ro # Maps your host's Apache logs into the container
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped

  # Homelab copy of VintageStream. The app repo keeps a standalone compose for
  # single-service installs; this file is what this machine runs.
  vintagestream:
    image: ghcr.io/s-vintagew/local-streaming-application:latest
    # :latest is already present locally after the first deploy. Always pull so a
    # newly published digest replaces the running container.
    pull_policy: always
    container_name: vintagestream
    restart: unless-stopped
    env_file:
      - /home/vintage/monitoring_setup_deploy/vintagestream.env
    environment:
      - PORT=6000
      - MEDIA_PATH=/media
      - SUB_CACHE_DIR=/tmp/vintagestream-subs
    ports:
      - "5173:6000"
    volumes:
      - /home/vintage/File_server:/media:ro
      - /tmp/vintage-thumb:/app/server/public/thumbnails
      - /tmp/vintage-subs:/tmp/vintagestream-subs

# volumes:
#   /var/prometheus/prometheus_data:
#   /var/grafana_data:
